{# templates/includes/categories_app/category_mobile_slider.html #}

{% load static %}
{% load i18n %}

<link rel="stylesheet"
      href="{% static 'css/includes/categories_app/category_mobile_slider.css' %}">

<div class="cat-mobile-slider">

    <ul class="cat-mobile-slider__list">

        {% if category.parent %}

            <li>

                <a href="{% url 'categories:detail' category.parent.slug %}"
                   class="cat-mobile-slider__btn">

                    {% trans "Баардыгы" %}

                </a>

            </li>

        {% else %}

            <li>

                <a href="{% url 'categories:detail' category.slug %}"
                   class="cat-mobile-slider__btn active">

                    {% trans "Баардыгы" %}

                </a>

            </li>

        {% endif %}

        {% for sub in subcategories %}

            <li>

                <a href="{% url 'categories:detail' sub.slug %}"
                   class="cat-mobile-slider__btn {% if category.slug == sub.slug %}active{% endif %}">

                    {{ sub.translated_name }}

                </a>

            </li>

        {% endfor %}

    </ul>

</div>
