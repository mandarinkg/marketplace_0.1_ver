{% extends 'base.html' %}

{% block content %}
<h1>Courier Заказы</h1>

{% for order in orders %}
    <p>
        Order #{{ order.id }} - {{ order.status }}

        <a href="{% url 'orders:update_status' order.id 'delivering' %}">
            Delivering
        </a>

        <a href="{% url 'orders:update_status' order.id 'delivered' %}">
            Delivered
        </a>
    </p>
{% endfor %}

{% endblock %}
