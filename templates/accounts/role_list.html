{% extends 'dashboard/base_dashboard.html' %}

{% block content %}
<h1>{{ title }}</h1>

{% for user in users %}
    <div style="background:white;padding:15px;margin-bottom:10px;border-radius:8px;">
        <p>{{ user.first_name }}</p>
        <p>{{ user.email }}</p>
        <p>{{ user.get_role_display }}</p>
    </div>
{% empty %}
    <p>No users found</p>
{% endfor %}

{% endblock %}
