{% extends 'base.html' %}

{% block title %}{{ title }} — FINE{% endblock %}

{% block content %}
<style>
.form-page-container { max-width: 560px; margin: 32px auto; padding: 0 16px; }
.form-card {
    background: #fff; border-radius: 20px;
    border: 1.5px solid #e1e8ed;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06); padding: 32px;
}
.form-title { font-size: 22px; font-weight: 800; color: #1a1a2e; margin: 0 0 24px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #1a1a2e; margin-bottom: 7px; }
.form-group input, .form-group textarea {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid #e1e8ed; border-radius: 10px;
    font-size: 14px; font-family: 'Inter', sans-serif;
    color: #1a1a2e; background: #f7f8fc;
    box-sizing: border-box; outline: none; transition: all 0.2s;
}
.form-group input:focus, .form-group textarea:focus {
    border-color: #2ecc71; background: #fff;
    box-shadow: 0 0 0 3px rgba(46,204,113,0.12);
}
.form-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-save {
    background: #2ecc71; color: #fff; border: none;
    padding: 13px 28px; font-size: 15px; font-weight: 700;
    border-radius: 10px; cursor: pointer; font-family: 'Inter', sans-serif;
    transition: background 0.2s;
}
.btn-save:hover { background: #27ae60; }
.btn-back {
    color: #636e72; text-decoration: none; font-size: 14px;
    font-weight: 500; padding: 13px 20px; border-radius: 10px;
    border: 1.5px solid #e1e8ed; transition: all 0.2s;
}
.btn-back:hover { border-color: #636e72; }
</style>

<div class="form-page-container">
    <div class="form-card">
        <h1 class="form-title">🏪 {{ title }}</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div style="color:#e74c3c;font-size:12px;margin-top:4px;">{{ field.errors|striptags }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="form-actions">
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Сохранить</button>
                <a href="{% url 'shops:list' %}" class="btn-back">Назад</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
