{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width:700px;">
    <h2>{{ title }}</h2>

    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Сохранить
        </button>

        <a href="{% url 'products:list' %}" class="btn btn-secondary">
            Назад
        </a>
    </form>
</div>
{% endblock %}
