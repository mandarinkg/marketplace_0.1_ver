{% extends 'base.html' %}

{% block content %}
<h2>{{ product.title }}</h2>

<p>{{ product.description }}</p>
<p>{{ product.price }} сом</p>
<p>Остаток: {{ product.stock }}</p>

<a href="{% url 'products:edit' product.slug %}">Редактировать</a>
<a href="{% url 'products:delete' product.slug %}">Удалить</a>
{% endblock %}
